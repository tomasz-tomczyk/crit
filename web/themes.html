<div class="theme-preview-layout">
  <nav class="theme-preview-list" aria-label="Themes">
    <div class="theme-preview-list-hint">↑ ↓ to switch</div>
    <div id="themeList" role="listbox" tabindex="0" aria-label="Themes"></div>
  </nav>
  <main class="theme-preview-main">
    <div class="theme-preview-bar">
      <div>
        <div class="theme-preview-name" id="themeName"></div>
        <div class="theme-preview-status" id="themeStatus" aria-live="polite"></div>
      </div>
      <button class="btn btn-primary" id="useTheme"></button>
    </div>
    <div id="themeSamples" inert></div>
  </main>
</div>

<div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="settings-dialog">
    <div class="settings-tabs" role="tablist" aria-label="Settings sections">
      <button class="settings-tab active" data-tab="settings" role="tab" aria-selected="true" aria-controls="settingsPane" id="tab-settings">Settings</button>
      <button class="settings-tab-close" id="settingsClose" aria-label="Close">&times;</button>
    </div>
    <div class="settings-content">
      <div class="settings-pane active" data-pane="settings" id="settingsPane" role="tabpanel" aria-labelledby="tab-settings"></div>
    </div>
  </div>
</div>

<script src="crit-shared.js"></script>
<script src="crit-icons.js"></script>
<script src="crit-settings-overlay.js"></script>
<script src="crit-settings-panes.js"></script>
<script src="crit-theme-boost.js"></script>
<script src="crit-pierre-adapter.js"></script>
<script src="crit-pierre-dom.js"></script>
<script>
  window.critPierreReady = new Promise(function(resolve) {
    var pm = document.createElement('script'); pm.type = 'module'; pm.src = 'pierre/pierre-diffs.js';
    pm.onload = function() { resolve(window.PierreDiffs || null); };
    pm.onerror = function() { resolve(null); };
    document.body.appendChild(pm);
  });
</script>
<script src="crit-theme-preview.js"></script>
</body>
</html>
