<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- The page preview mode serves for an Excalidraw scene (servePreviewExcalidraw
     fills in the title and the scene): an infinite canvas in the style of
     Excalidraw's. Self-contained: it runs in the preview iframe, without the
     review page's stylesheets. -->
<style>
  :root {
    --canvas-grid: #c9c9d1;
    --island-bg: #ffffff;
    --island-fg: #1b1b1f;
    --island-hover: #f1f0ff;
    --island-selected-bg: #e0dfff;
    --island-selected-fg: #4a47b1;
    --island-shadow: 0 0 0 1px rgb(0 0 0 / 0.06), 0 1px 3px rgb(0 0 0 / 0.08), 0 7px 14px rgb(0 0 0 / 0.05);
    --canvas-error: #c92a2a;
  }
  :root[data-canvas-theme="dark"] {
    --canvas-grid: #3b3b45;
    --island-bg: #232329;
    --island-fg: #e3e3e8;
    --island-hover: #2e2d39;
    --island-selected-bg: #403e6a;
    --island-selected-fg: #e0dfff;
    --island-shadow: 0 0 0 1px rgb(255 255 255 / 0.06), 0 1px 3px rgb(0 0 0 / 0.3), 0 7px 14px rgb(0 0 0 / 0.25);
    --canvas-error: #ff8787;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
  }
  /* The empty canvas: everything not covered by an element, with the grid. */
  #crit-canvas-bg {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, var(--canvas-grid) 1px, transparent 1.25px);
  }
  :root.crit-canvas-no-grid #crit-canvas-bg { background-image: none; }
  #crit-canvas-stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  #crit-canvas-stage > svg {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    transform-origin: 0 0;
  }
  :root.crit-canvas-hand, :root.crit-canvas-hand * { cursor: grab !important; }
  :root.crit-canvas-grabbing, :root.crit-canvas-grabbing * { cursor: grabbing !important; }

  #crit-canvas-islands {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  #crit-canvas-islands[hidden] { display: none; }
  .crit-island {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    color: var(--island-fg);
    background: var(--island-bg);
    border-radius: 8px;
    box-shadow: var(--island-shadow);
  }
  .crit-island button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    padding: 0 6px;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .crit-island button:hover { background: var(--island-hover); }
  .crit-island button[aria-pressed="true"] { color: var(--island-selected-fg); background: var(--island-selected-bg); }
  .crit-island button:focus-visible { outline: 2px solid #6965db; outline-offset: -2px; }
  .crit-island svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #crit-canvas-zoom { min-width: 52px; font-variant-numeric: tabular-nums; }
  :root[data-canvas-theme="dark"] .crit-icon-moon, :root:not([data-canvas-theme="dark"]) .crit-icon-sun { display: none; }

  #crit-canvas-error {
    position: fixed;
    inset: 24px;
    margin: 0;
    white-space: pre-wrap;
    color: var(--canvas-error);
  }
</style>
</head>
<body>
<div id="crit-canvas-bg"></div>
<div id="crit-canvas-stage"></div>
<div id="crit-canvas-islands" hidden>
  <div class="crit-island" role="toolbar" aria-label="Zoom">
    <button type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out (-)"><svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>
    <button type="button" data-action="reset" id="crit-canvas-zoom" aria-label="Reset zoom to 100%" title="Reset zoom (0)">100%</button>
    <button type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 20 20"><path d="M10 5v10M5 10h10"/></svg></button>
  </div>
  <div class="crit-island" role="toolbar" aria-label="Canvas">
    <button type="button" data-action="fit" aria-label="Zoom to fit" title="Zoom to fit (1)"><svg viewBox="0 0 20 20"><path d="M4 8V4h4M12 4h4v4M16 12v4h-4M8 16H4v-4"/></svg></button>
    <button type="button" data-action="hand" aria-label="Hand tool" aria-pressed="false" title="Hand: drag to pan (H, or hold Space)"><svg viewBox="0 0 20 20"><path d="M7 11V5.5a1.25 1.25 0 0 1 2.5 0V10M9.5 5V4a1.25 1.25 0 0 1 2.5 0v6M12 5.5a1.25 1.25 0 0 1 2.5 0V10M14.5 7.5a1.25 1.25 0 0 1 2.5 0v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.1L3.2 12.6a1.3 1.3 0 0 1 2-1.7L7 13"/></svg></button>
    <button type="button" data-action="grid" aria-label="Grid" aria-pressed="true" title="Grid"><svg viewBox="0 0 20 20"><path d="M4 4h12v12H4zM4 8h12M4 12h12M8 4v12M12 4v12"/></svg></button>
    <button type="button" data-action="theme" aria-label="Switch light or dark canvas" title="Light / dark canvas"><svg viewBox="0 0 20 20" class="crit-icon-moon"><path d="M15.5 12.5A6 6 0 0 1 7.5 4.5a6 6 0 1 0 8 8z"/></svg><svg viewBox="0 0 20 20" class="crit-icon-sun"><circle cx="10" cy="10" r="3.25"/><path d="M10 2.5v1.5M10 16v1.5M2.5 10H4M16 10h1.5M4.7 4.7l1.06 1.06M14.24 14.24l1.06 1.06M4.7 15.3l1.06-1.06M14.24 5.76l1.06-1.06"/></svg></button>
  </div>
</div>
<pre id="crit-canvas-error" hidden></pre>
<script id="crit-excalidraw-scene" type="application/json">{{SCENE}}</script>
<!-- Loaded up front (not on demand) so the drawing is in the page before the
     agent scripts that follow resolve their pins against it. -->
<script src="/rough.min.js"></script>
<script src="/freehand.min.js"></script>
<script src="/crit-renderer-excalidraw.js"></script>
<script src="/crit-excalidraw-canvas.js"></script>
</body>
</html>
