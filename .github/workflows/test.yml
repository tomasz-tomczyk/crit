name: Test

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install jj
        run: |
          JJ_VERSION=0.40.0
          mkdir -p /tmp/jj-install
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp/jj-install
          sudo install /tmp/jj-install/jj /usr/local/bin/jj
          jj --version

      - name: Install sapling
        run: |
          SL_VERSION="0.2.20260317-201835+0234c21f"
          SL_VERSION_ENC="${SL_VERSION//+/%2B}"
          sudo mkdir -p /opt/sapling
          curl -fsSL "https://github.com/facebook/sapling/releases/download/${SL_VERSION_ENC}/sapling-${SL_VERSION}-linux-x64.tar.xz" \
            | sudo tar xJ -C /opt/sapling
          sudo ln -sf /opt/sapling/sl /usr/local/bin/sl
          sl --version

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check integration hashes are up to date
        run: |
          go run ./cmd/crit/gen_integration_hashes.go
          if ! git diff --exit-code -- cmd/crit/integration_hashes_gen.go; then
            echo "::error::integration_hashes_gen.go is out of sync with integrations/."
            echo "::error::Run 'go run ./cmd/crit/gen_integration_hashes.go' and commit the result."
            exit 1
          fi

      - name: Install and run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify embedded frontend assets
        run: make verify-assets
      - name: ESLint
        run: npx eslint web/app.js
      - name: Stylelint
        run: npx stylelint "web/*.css"
      - name: CSS variable validation
        run: bash scripts/check-css-vars.sh

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run frontend smoke tests
        run: make test-frontend
      - name: Run frontend perf microbenchmarks
        run: npm run test:perf

  asset-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check embedded asset + binary size budgets
        run: bash scripts/check-asset-budget.sh

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Install benchstat
        # x/perf ships no versioned releases, so @latest tracks the Go
        # toolchain; benchstat's comparison output format is stable.
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks (PR head)
        run: go test -run='^$' -bench=. -benchmem -count=6 ./internal/diff/ ./internal/session/ | tee bench-new.txt

      - name: Run benchmarks (base)
        id: base
        # Resolve the base commit directly: on fork PRs origin/$BASE_REF may
        # not exist, but the base SHA is always present in a full clone.
        # A missing baseline fails the job — a silently-skipped gate is worse
        # than a noisy one, and this step only fails on real infra problems.
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ] || ! git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            BASE_REF="${{ github.base_ref }}"
            [ -z "$BASE_REF" ] && BASE_REF="main"
            git fetch origin "$BASE_REF" 2>/dev/null || true
            BASE_SHA="origin/$BASE_REF"
          fi
          git worktree add /tmp/crit-base "$BASE_SHA"
          cd /tmp/crit-base
          go test -run='^$' -bench=. -benchmem -count=6 ./internal/diff/ ./internal/session/ > "$GITHUB_WORKSPACE/bench-old.txt"

      - name: Remove base worktree
        if: always()
        run: git worktree remove --force /tmp/crit-base || true

      - name: Self-test the bench gate
        # The gate can't detect its own parser regressions — lock the contract.
        run: python3 scripts/bench-compare_test.py

      - name: Compare with benchstat
        run: |
          benchstat bench-old.txt bench-new.txt | tee benchstat.txt
          python3 scripts/bench-compare.py benchstat.txt

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check Nix package build
        run: ./scripts/check-nix-build.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install jj
        run: |
          JJ_VERSION=0.40.0
          mkdir -p /tmp/jj-install
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp/jj-install
          sudo install /tmp/jj-install/jj /usr/local/bin/jj
          jj --version

      - name: Install sapling
        run: |
          SL_VERSION="0.2.20260317-201835+0234c21f"
          SL_VERSION_ENC="${SL_VERSION//+/%2B}"
          sudo mkdir -p /opt/sapling
          curl -fsSL "https://github.com/facebook/sapling/releases/download/${SL_VERSION_ENC}/sapling-${SL_VERSION}-linux-x64.tar.xz" \
            | sudo tar xJ -C /opt/sapling
          sudo ln -sf /opt/sapling/sl /usr/local/bin/sl
          sl --version

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Run tests with coverage
        run: |
          PKGS=$(go list ./... | grep -v /node_modules/)
          go test -coverprofile=coverage.out -covermode=atomic $PKGS

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  live-cdp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: browser-actions/setup-chrome@v2

      - name: Run live CDP integration tests
        run: go test -tags integration -run TestLiveCDPIntegration -v -count=1 ./internal/live/...

  unit-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # jj is intentionally not installed on Windows; JJ backend tests skip
      # when `jj` is not on PATH. Linux coverage is provided by the unit job.

      # Best-effort speedup only — a flaky restore must not skip tests.
      - name: Cache Go build cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Run tests
        run: go test ./...

      # Some tests spawn `crit.exe` daemons that may outlive the test process
      # by a few seconds (background goroutines, deferred file flushes). If
      # they're still alive when actions/setup-go's post step packs the cache
      # tar, the cache step fails because the binary is locked. Kill any
      # leftover processes before the implicit post-cache step runs.
      - name: Kill leftover crit daemons
        if: always()
        shell: cmd
        run: taskkill /F /IM crit.exe /T 2>nul || exit /b 0

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Install npm dependencies
        working-directory: test/e2e
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: test/e2e
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: test/e2e
        run: npx playwright install-deps chromium

      - name: Build crit with coverage instrumentation
        run: |
          mkdir -p /tmp/crit-coverdir
          go build -cover -o /tmp/crit-cover-bin ./cmd/crit

      - name: Run E2E tests
        working-directory: test/e2e
        run: bash run.sh
        env:
          CRIT_BIN: /tmp/crit-cover-bin
          GOCOVERDIR: /tmp/crit-coverdir

      - name: Convert E2E coverage data
        if: always()
        run: |
          if [ -d /tmp/crit-coverdir ] && ls /tmp/crit-coverdir/*.* >/dev/null 2>&1; then
            go tool covdata textfmt -i=/tmp/crit-coverdir -o=e2e-coverage.out
          fi

      - name: Upload E2E coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: e2e-coverage.out
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test/e2e/test-results/
          retention-days: 7

  e2e-windows:
    runs-on: windows-2025-vs2026
    env:
      # Stop Git Bash from auto-converting POSIX-looking arguments to Windows
      # paths when invoking native binaries (crit.exe, taskkill, powershell).
      MSYS_NO_PATHCONV: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('**/*.go', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Install npm dependencies
        working-directory: test/e2e
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: test/e2e
        run: npx playwright install chromium

      - name: Build crit with coverage instrumentation
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/crit-coverdir"
          go build -cover -o crit-cover-bin.exe ./cmd/crit

      - name: Run E2E tests
        working-directory: test/e2e
        shell: bash
        run: bash run.sh
        env:
          CRIT_BIN: ${{ github.workspace }}/crit-cover-bin.exe
          GOCOVERDIR: ${{ runner.temp }}/crit-coverdir

      - name: Convert E2E coverage data
        if: always()
        shell: bash
        run: |
          if [ -d "${RUNNER_TEMP}/crit-coverdir" ] && ls "${RUNNER_TEMP}"/crit-coverdir/*.* >/dev/null 2>&1; then
            go tool covdata textfmt -i="${RUNNER_TEMP}/crit-coverdir" -o=e2e-coverage.out
          fi

      - name: Upload E2E coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: e2e-coverage.out
          flags: e2e
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-windows
          path: test/e2e/test-results/
          retention-days: 7

      # Some tests spawn `crit.exe` daemons that may outlive the test process
      # by a few seconds. If they're still alive when actions/setup-* post
      # steps pack their caches, the cache step fails because the binary is
      # locked. Kill any leftover processes before the implicit post-cache
      # steps run. Mirrors the unit-windows job pattern.
      - name: Kill leftover crit daemons
        if: always()
        shell: cmd
        run: taskkill /F /IM crit.exe /T 2>nul || exit /b 0
